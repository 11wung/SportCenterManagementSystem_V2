spring.application.name=SportCenterManagementSystem_V2
spring.datasource.url=jdbc:postgresql://localhost:5432/scms_database
spring.datasource.username=postgres
spring.datasource.password=123
###JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
###
spring.jpa.hibernate.ddl-auto=none
# Prevent internal stack traces from being exposed in default error responses
server.error.include-stacktrace=never
# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
# PayOS Redirect URLs
payos.return-url=${PAYOS_RETURN_URL}
payos.cancel-url=${PAYOS_CANCEL_URL}