spring.application.name=SportCenterManagementSystem_V2
spring.datasource.url=jdbc:postgresql://localhost:5432/scms_database
spring.datasource.username=postgres
spring.datasource.password=123
###JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
###
spring.jpa.hibernate.ddl-auto=none
# Prevent internal stack traces from being exposed in default error responses
server.error.include-stacktrace=never
# PayOS keys are read from env vars PAYOS_CLIENT_ID, PAYOS_API_KEY, PAYOS_CHECKSUM_KEY
# (only needed when using online payment)
# PayOS Redirect URLs
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/api/payments/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/api/payments/payos/cancel}
# Gmail SMTP: MAIL_USERNAME = địa chỉ Gmail, MAIL_PASSWORD = App Password 16 ký tự (không phải mật khẩu Gmail).
# Để trống MAIL_USERNAME thì mã xác thực chỉ được in ra log (dùng khi phát triển).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# CORS: front-end origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Trang FE mà PayOS chuyển người dùng về sau khi thanh toán hoặc hủy
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
